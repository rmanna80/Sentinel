[project]
name = "sentinel-core"
version = "0.1.0"
description = "Shared contract between the Sentinel agent and server"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sentinel_core"]
