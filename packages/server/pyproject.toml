[project]
name = "sentinel-server"
version = "0.1.0"
description = "Sentinel server: API, storage, scoring, detection and integrations"
requires-python = ">=3.12"
dependencies = [
    "sentinel-core",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "argon2-cffi>=23.1",
    "httpx>=0.27",
    "keyring>=25",
    "defusedxml>=0.7",
    "reportlab>=4.2",
]

[project.scripts]
sentinel-server = "sentinel_server.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sentinel_server"]
