[project]
name = "sentinel-agent"
version = "0.1.0"
description = "Sentinel agent: runs registered, read-only security checks and reports to the Sentinel server"
requires-python = ">=3.12"
dependencies = [
    "sentinel-core",
    "sentinel-detect",
    "pydantic>=2.7",
    "psutil>=5.9",
    "httpx>=0.27",
    "keyring>=25",
    "defusedxml>=0.7",
]

[project.scripts]
sentinel-agent = "sentinel_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sentinel_agent"]
